server {
    listen 4143;
    listen [::]:4143;
    server_name _;

    auth_basic "Video Pipeline Control Panel";
    auth_basic_user_file /etc/nginx/.htpasswd-ordak-vnc;

    # While a live runner remains a child of the main panel service, this narrow
    # sidecar supplies passive websocket notifications without restarting it.
    location = /api/ws {
        proxy_pass http://127.0.0.1:4145;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location = /api/style-catalog {
        proxy_pass http://127.0.0.1:4145;
        proxy_set_header Host $host;
    }

    location ^~ /api/styles/ {
        proxy_pass http://127.0.0.1:4145;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:4142;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }
}
