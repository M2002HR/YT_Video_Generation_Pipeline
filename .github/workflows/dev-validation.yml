name: Dev validation
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dev-validation-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest numpy
      - name: Opening configuration and syntax
        run: |
          set -euo pipefail
          python scripts/check_opening_setup.py
          python -m compileall -q scripts
      - name: Python regression suite (no paid providers)
        run: |
          set -euo pipefail
          python -m pytest -q -rs tests --junitxml=/tmp/dev-python-results.xml | tee /tmp/dev-python-tests.txt
      - name: UI tests and production build
        run: |
          set -euo pipefail
          npm --prefix control_panel/ui ci
          npm --prefix control_panel/ui test -- --run | tee /tmp/dev-ui-tests.txt
          npm --prefix control_panel/ui run build
      - name: Verify tests did not rewrite source
        run: git diff --exit-code -- scripts tests projects/q_station
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: dev-validation-results
          path: |
            /tmp/dev-python-tests.txt
            /tmp/dev-python-results.xml
            /tmp/dev-ui-tests.txt
          if-no-files-found: ignore
          retention-days: 14
