name: Gateway integration work
on:
  push:
    branches: ['feature/character-gateways-v2']
permissions:
  contents: write
concurrency:
  group: gateway-integration-work
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect current contracts
        run: |
          python - <<'PY'
          import ast, re
          from pathlib import Path
          for name in ['run_q_station_pipeline.py','opening_runtime.py','image_artifacts.py','flow_gate.py','run_full_video_pipeline_q_station_wrapper.py','pipeline_stages.py']:
              p=Path('scripts')/name
              print('\nFUNCTIONS',p)
              t=ast.parse(p.read_text())
              for n in ast.walk(t):
                  if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):
                      print(n.lineno,n.end_lineno,n.name)
          for p in sorted(Path('projects/q_station/prompts').rglob('*.md')):
              print('PROMPT',p)
          for root in ['scripts','projects/q_station/prompts','projects/q_station/presentation_profiles']:
              for p in sorted(Path(root).rglob('*')):
                  if p.suffix not in {'.py','.md','.json'} or not p.is_file(): continue
                  for i,line in enumerate(p.read_text().splitlines(),1):
                      if re.search(r'inner illustration window|page/card|page.surface|page texture|page frame|page border|book.world|book spread|book-like|storybook|eyepiece|objective lens',line,re.I):
                          print('MATCH',p,i,line.strip()[:260])
          for p in sorted(Path('videos/038_could_you_live_forever_on_a_desert_island').rglob('*')):
              if p.is_file() and ('reference' in str(p) or p.name in ['WORLD_STYLE_PLAN.json','VISUAL_PLAN.json','EPISODE_PLAN.json','CHARACTER_RESOLUTION.json']):
                  print('RUN_ASSET',p,p.stat().st_size)
          PY
      - name: Apply integration when staged
        run: |
          if [ -f scripts/_gateway_integration_tmp.py ]; then
            python scripts/_gateway_integration_tmp.py
          fi
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -q -r requirements.txt pytest numpy
          npm --prefix control_panel/ui ci
      - name: Validate configuration and syntax
        run: |
          python scripts/check_opening_setup.py
          python -m compileall -q scripts tests
          git diff --check
      - name: Full regression suite
        run: |
          set -euo pipefail
          python -m pytest -q -rs tests | tee /tmp/gateway-tests.txt
          npm --prefix control_panel/ui test -- --run
          npm --prefix control_panel/ui run build
      - name: Commit staged integration only after successful validation
        run: |
          if [ -f scripts/_gateway_integration_tmp.py ]; then
            rm scripts/_gateway_integration_tmp.py
            rm .github/workflows/gateway-integration-work.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'feat(q-station): integrate four gateways and isolate topic-world visuals'
            git push origin HEAD:feature/character-gateways-v2
          fi
