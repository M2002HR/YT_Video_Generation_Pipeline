name: Gateway integration work
on:
  push:
    branches: ['feature/character-gateways-v2']
permissions:
  contents: write
concurrency:
  group: gateway-integration-work
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply staged integration
        run: |
          set -euo pipefail
          python scripts/_gateway_integration_tmp.py
          git add -A
          git diff --cached --check
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg > /tmp/gateway-apt.log
          python -m pip install -q -r requirements.txt pytest numpy
          npm --prefix control_panel/ui ci
      - name: Validate configuration and syntax
        run: |
          python scripts/check_opening_setup.py
          python -m compileall -q scripts tests
          git diff --check
      - name: Full Python regression suite
        run: |
          set -euo pipefail
          python -m pytest -q -rs tests --junitxml=/tmp/gateway-tests.xml | tee /tmp/gateway-tests.txt
      - name: UI tests and production build
        run: |
          npm --prefix control_panel/ui test -- --run
          npm --prefix control_panel/ui run build
      - name: Source integrity and geometry guard
        run: |
          git diff --exit-code -- scripts tests projects docs videos .env.example requirements.txt
          PYTHONPATH=scripts python - <<'PY'
          from run_q_station_pipeline import assess_image_content_qc
          import gateway_contracts as g
          v, _ = assess_image_content_qc({'passed': True, 'description': 'Optical error', 'violations': ['Spyglass orientation appears reversed: wide objective at the eye.']})
          assert v['passed'] is False
          assert not g.review_matches({'passed': True}, '[VISUAL_CONTRACT:spyglass_entry_v2]')
          print('Independent geometry and missing-evidence checks passed.')
          PY
      - name: Commit validated integration
        run: |
          set -euo pipefail
          rm scripts/_gateway_integration_tmp.py .github/workflows/gateway-integration-work.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(q-station): integrate four gateways and isolate topic-world visuals'
          git push origin HEAD:feature/character-gateways-v2
