name: Gateway rollout check
on:
  push:
    branches: ['feature/character-gateways-v2']
permissions:
  contents: write
concurrency:
  group: gateway-rollout-check
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply final rollout audit
        run: |
          python scripts/_gateway_resume_patch_tmp.py
          git add -A
          git diff --cached --check
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg > /tmp/gateway-apt.log
          python -m pip install -q -r requirements.txt pytest numpy
          npm --prefix control_panel/ui ci
      - name: Full regression and configuration
        run: |
          set -euo pipefail
          python scripts/check_opening_setup.py
          python -m compileall -q scripts tests
          python -m pytest -q -rs tests | tee /tmp/gateway-final-tests.txt
          npm --prefix control_panel/ui test -- --run
          npm --prefix control_panel/ui run build
      - name: Verify source and commit validated audit
        run: |
          set -euo pipefail
          git diff --exit-code -- scripts tests projects docs videos requirements.txt .env.example
          rm scripts/_gateway_resume_patch_tmp.py .github/workflows/gateway-rollout-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: retain verified pre-rollout stories and enforce doorway plane consistency'
          git push origin HEAD:feature/character-gateways-v2
