name: Language upgrade source verification
on:
  push:
    branches: [dev]
    paths: [.github/workflows/language-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Snapshot tracked sources for offline regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/language-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  path = pathlib.Path(name)
                  if not path.is_file() or path.is_symlink():
                      continue
                  if name == '.env' or name.startswith('services/'):
                      continue
                  if name.startswith('videos/') and path.suffix.lower() not in {'.py', '.json', '.md', '.txt', '.csv', '.ass', '.srt', '.vtt', '.yaml', '.yml'}:
                      continue
                  z.write(path, name)
              z.writestr('SOURCE_COMMIT.txt', subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: language-source
          path: /tmp/language-source.zip
          retention-days: 3
