name: Q Station only cleanup
on:
  push:
    branches: ['cleanup/q-station-only']
permissions:
  contents: write
concurrency:
  group: q-station-only-cleanup
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply one-shot repository cleanup
        run: |
          set -euo pipefail
          python scripts/_q_station_cleanup_tmp.py
          git add -A
          git status --short
          git diff --cached --check
      - name: Install validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest numpy
          npm --prefix control_panel/ui ci
      - name: Repository hygiene and syntax checks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path.cwd()
          banned = [
              '_'.join(('question', 'harvest')),
              '_'.join(('world', 'behind', 'the', 'question')),
              '_'.join(('farmer', 'host')),
          ]
          hits = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              rel = path.relative_to(root).as_posix()
              low_rel = rel.lower()
              for token in banned:
                  if token in low_rel:
                      hits.append(f'PATH {rel}: {token}')
              raw = path.read_bytes()
              if b'\0' in raw[:8192]:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              low = text.lower()
              for token in banned:
                  if token in low:
                      hits.append(f'TEXT {rel}: {token}')
              if re.search(r'(?<![a-z0-9_])qh(?![a-z0-9_])', low):
                  hits.append(f'TEXT {rel}: standalone retired runtime abbreviation')
          if hits:
              print('\n'.join(hits[:250]))
              raise SystemExit(f'{len(hits)} retired identifier occurrence(s) remain')
          PY
          python -m compileall -q scripts
          python scripts/check_opening_setup.py
      - name: Python regression suite
        run: |
          set -euo pipefail
          python -m pytest -q -rs tests --junitxml=/tmp/q-station-cleanup-python.xml | tee /tmp/q-station-cleanup-python.txt
      - name: UI tests and production build
        run: |
          set -euo pipefail
          npm --prefix control_panel/ui test -- --run | tee /tmp/q-station-cleanup-ui.txt
          npm --prefix control_panel/ui run build
      - name: Commit validated cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(q-station): remove retired projects and host'
          git push origin HEAD:cleanup/q-station-only
