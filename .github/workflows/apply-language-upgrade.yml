name: Apply verified plain English upgrade
on:
  push:
    branches: [dev]
    paths: [.github/workflows/apply-language-upgrade.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  integrate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and apply tested language source patch
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.maintenance').glob('language-v1.payload.*'))
          assert len(parts) == 4, 'Missing language payload part'
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '351830838d580cd36450a32a2c79c50256b3b83cdf4348cbad2669bda33309bb', 'Patch hash mismatch'
          path = pathlib.Path('/tmp/language-upgrade.patch'); path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest numpy
      - name: Language preflight and full Python regression
        run: |
          set -euo pipefail
          python scripts/check_opening_setup.py
          python -m compileall -q scripts
          python -m pytest -q -rs tests --junitxml=/tmp/language-python-results.xml | tee /tmp/language-python-tests.txt
      - name: UI regression tests and production build
        run: |
          set -euo pipefail
          npm --prefix control_panel/ui ci
          npm --prefix control_panel/ui test -- --run | tee /tmp/language-ui-tests.txt
          npm --prefix control_panel/ui run build
      - name: Publish only verified source changes to dev
        run: |
          set -euo pipefail
          git diff --exit-code -- scripts tests projects/q_station docs PROJECT_CONTEXT.md
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git rm .maintenance/language-v1.payload.* .github/workflows/apply-language-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: write and review clear international English before narration'
          git push origin HEAD:dev
          echo "IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)" | tee /tmp/language-implementation-commit.txt
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: language-upgrade-verification
          path: |
            /tmp/language-python-results.xml
            /tmp/language-python-tests.txt
            /tmp/language-ui-tests.txt
            /tmp/language-implementation-commit.txt
          if-no-files-found: ignore
          retention-days: 14
